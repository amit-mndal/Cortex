services:
  - type: web
    name: cortex-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CHROMA_DB_PATH
        value: ./data/chroma
      - key: COLLECTION_NAME
        value: cortex_docs
      - key: DATABASE_URL
        sync: false

  - type: worker
    name: cortex-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: celery -A app.workers.tasks worker --loglevel=info --concurrency=2
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CHROMA_DB_PATH
        value: ./data/chroma
      - key: COLLECTION_NAME
        value: cortex_docs
      - key: DATABASE_URL
        sync: false
